{% extends "base.html" %}


{% block content %}

<section class="login-section">

    <div class="login-container">


        <div class="login-card">


            <div class="login-header">

                <img src="{{ url_for('static', filename='images/logo.svg') }}"
                     alt="Aetheris Logo">

                <h1>
                    Employee Portal
                </h1>

                <p>
                    Secure access for Aetheris Technologies employees.
                </p>

            </div>

            {% if error %}

            <div class="login-error">

                {{ error }}

            </div>

            {% endif %}

            <form class="login-form" method="POST">

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>



                <div class="login-options">

                    <label>

                        <input type="checkbox">

                        Remember me

                    </label>


                    <a href="#">
                        Forgot password?
                    </a>

                </div>



                <button class="btn btn-primary login-btn">

                    Sign In

                </button>


            </form>



            <div class="security-note">

                🛡️ Protected by Aetheris Security Infrastructure

            </div>


        </div>


    </div>


</section>


{% endblock %}

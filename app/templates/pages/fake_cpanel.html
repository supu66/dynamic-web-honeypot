{% extends "base.html" %}

{% block content %}

<section class="login-section">

    <div class="container">

        <div class="login-card">

            <h1>cPanel Login</h1>

            <p>
                Hosting Control Panel
            </p>

            <form>

                <input
                    type="text"
                    placeholder="Username"
                >

                <input
                    type="password"
                    placeholder="Password"
                >

                <button
                    class="btn btn-primary"
                    type="button">

                    Log In

                </button>

            </form>

        </div>

    </div>

</section>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<section class="login-section">

    <div class="container">

        <div class="login-card">

            <h1>Administrator Portal</h1>

            <p>
                Aetheris Technologies Security Operations Center
            </p>

            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                <div class="form-group">
                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter administrator username"
                        required>
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter administrator password"
                        required>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Sign In

                </button>

            </form>

        </div>

    </div>

</section>

{% endblock %}

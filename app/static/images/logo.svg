<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

    <defs>

        <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1f6feb"/>
            <stop offset="100%" stop-color="#00c2ff"/>
        </linearGradient>

        <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#dbeafe"/>
        </linearGradient>

    </defs>

    <!-- Shield -->

    <path
        d="M256 40
           L400 96
           V210
           C400 320 334 405 256 460
           C178 405 112 320 112 210
           V96
           Z"
        fill="url(#shieldGradient)"
    />

    <!-- Globe -->

    <circle
        cx="256"
        cy="220"
        r="90"
        fill="none"
        stroke="url(#globeGradient)"
        stroke-width="10"
    />

    <!-- Vertical -->

    <line
        x1="256"
        y1="130"
        x2="256"
        y2="310"
        stroke="white"
        stroke-width="8"
    />

    <!-- Horizontal -->

    <line
        x1="166"
        y1="220"
        x2="346"
        y2="220"
        stroke="white"
        stroke-width="8"
    />

    <!-- Globe Curves -->

    <ellipse
        cx="256"
        cy="220"
        rx="35"
        ry="90"
        fill="none"
        stroke="white"
        stroke-width="6"
    />

    <ellipse
        cx="256"
        cy="220"
        rx="65"
        ry="90"
        fill="none"
        stroke="white"
        stroke-width="4"
        opacity="0.7"
    />

    <!-- Lock -->

    <rect
        x="220"
        y="320"
        width="72"
        height="58"
        rx="10"
        fill="white"
    />

    <path
        d="M235 320
           V298
           C235 275 248 260 256 260
           C264 260 277 275 277 298
           V320"
        fill="none"
        stroke="white"
        stroke-width="10"
        stroke-linecap="round"
    />

    <!-- Keyhole -->

    <circle
        cx="256"
        cy="345"
        r="8"
        fill="#1f6feb"
    />

    <rect
        x="252"
        y="345"
        width="8"
        height="18"
        fill="#1f6feb"
    />

</svg>